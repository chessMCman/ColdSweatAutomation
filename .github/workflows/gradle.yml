name: Build & Release

# 手动构建：在 GitHub 仓库的 Actions 页面选择本工作流，点击 "Run workflow"。
#   - "Release tag" 留空  -> 只构建，产物在 Artifacts 里下载
#   - "Release tag" 填写  -> 构建成功后自动创建对应的 GitHub Release 并上传 jar
# 推送 v 开头的标签（git tag v1.0.0 && git push --tags）也会自动构建并发布 Release。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. v1.0.0 (leave empty to build without publishing)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d '=' -f2 | tr -d ' \r')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColdSweatAutomation-${{ steps.version.outputs.version }}
          path: build/libs/ColdSweatAutomation-*.jar
          if-no-files-found: error

      - name: Determine release tag
        id: tag
        if: ${{ github.event_name == 'push' || inputs.release_tag != '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          JAR="build/libs/ColdSweatAutomation-${VERSION}.jar"
          printf 'Cold Sweat Automation %s\n\n' "$TAG" > notes.md
          printf -- '- 冰箱食物槽扩充至 108 格（12x9），GUI 同步更新\n' >> notes.md
          printf -- '- 壁炉/锅炉/冰箱支持 Create（机械动力）与 AE2 从任意面输入燃料，锅炉可输出加工成品\n' >> notes.md
          printf -- '- 需要前置：NeoForge 21.1.181+、Cold Sweat 2.4.4；Create/AE2 可选（都未安装时仅启用冰箱扩容）\n' >> notes.md
          printf -- '- 客户端与服务端必须同时安装本模组\n' >> notes.md
          # Create the release; if it already exists (re-run of the same tag), just replace the asset
          gh release create "$TAG" "$JAR" \
            --title "ColdSweatAutomation ${TAG}" \
            --notes-file notes.md \
            || gh release upload "$TAG" "$JAR" --clobber
