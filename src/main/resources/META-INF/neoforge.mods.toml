modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="Cold Sweat Automation"
    description='''
Adds item-automation compatibility for Cold Sweat's Hearth, Boiler and Icebox, and expands the
Icebox to 108 food slots with a matching GUI.

Create (机械动力) and AE2 (Applied Energistics 2) are both OPTIONAL: whichever is installed gets
its automation enabled (funnels/chutes for Create, buses/interfaces for AE2). If neither is
installed, only the icebox expansion is active.

- Hearth / Boiler / Icebox accept fuel from Create funnels/chutes and AE2 buses/interfaces on any side.
- The Boiler outputs its processed products (warmed waterskins / purified drinks) on any side.
- The Icebox food storage is expanded to 108 slots (12x9 grid), GUI included.
'''

[[mixins]]
    config="cold_sweat_automation.mixins.json"

[[dependencies.cold_sweat_automation]]
    modId="neoforge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.cold_sweat_automation]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.cold_sweat_automation]]
    modId="cold_sweat"
    mandatory=true
    versionRange="[2.4.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.cold_sweat_automation]]
    modId="create"
    mandatory=false
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.cold_sweat_automation]]
    modId="ae2"
    mandatory=false
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"
